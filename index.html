<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Background Ambient Glows for OLED Glass effect */
    .glow-1 {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(0, 122, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: 15%;
      left: 10%;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(142, 68, 173, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 15%;
      right: 10%;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 1;
    }

    /* iOS Glassmorphic Card */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      background: rgba(22, 22, 24, 0.65);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 36px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
      text-align: center;
      color: #ffffff;
    }

    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .icon-container svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .user-email {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 28px;
      word-break: break-all;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0 46px 0 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 122, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.2);
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      background: #007AFF;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #0066d6;
    }

    .btn-submit:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 13.5px;
      line-height: 1.4;
      display: none;
    }

    .error { color: #ff453a; }
    .success { color: #30d158; }

    /* Spinner */
    .loader {
      display: none;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>

    <h2>Reset Password</h2>
    <p id="user-email" class="user-email">Verifying link...</p>

    <form id="reset-form">
      <div class="input-group">
        <input type="password" id="new-password" class="input-field" placeholder="New Password (min 6 characters)" required minlength="6">
        <button type="button" class="toggle-pass" onclick="togglePass('new-password', this)">
          👁️
        </button>
      </div>

      <div class="input-group">
        <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password" required minlength="6">
        <button type="button" class="toggle-pass" onclick="togglePass('confirm-password', this)">
          👁️
        </button>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        <span id="btn-text">Save New Password</span>
        <div class="loader" id="loader"></div>
      </button>
    </form>

    <p id="status-msg" class="status-msg"></p>
  </div>

  <!-- Firebase Scripts (v10 Modular SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // আপনার Firebase Console থেকে Config টি এখানে বসান
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "sjemar-bdc9d.firebaseapp.com",
      projectId: "sjemar-bdc9d",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // URL থেকে কোড নেওয়া
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    const emailEl = document.getElementById('user-email');
    const statusMsg = document.getElementById('status-msg');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');

    // লিংক ভ্যালিড কিনা চেক করা
    if (!oobCode) {
      showError("Invalid or missing reset token.");
      form.style.display = 'none';
    } else {
      verifyPasswordResetCode(auth, oobCode)
        .then((email) => {
          emailEl.textContent = `for ${email}`;
        })
        .catch((error) => {
          showError("This reset link has expired or has already been used.");
          form.style.display = 'none';
        });
    }

    // পাসওয়ার্ড সাবমিট হ্যান্ডলার
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (pass !== confirmPass) {
        showError("Passwords do not match.");
        return;
      }

      setLoading(true);

      try {
        await confirmPasswordReset(auth, oobCode, pass);
        setLoading(false);
        showSuccess("Password changed successfully! You can now log in to the app.");
        form.style.display = 'none';
      } catch (err) {
        setLoading(false);
        showError(err.message || "Failed to reset password.");
      }
    });

    function showError(msg) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
    }

    function showSuccess(msg) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg success';
      statusMsg.style.display = 'block';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnText.style.display = 'none';
        loader.style.display = 'block';
        submitBtn.disabled = true;
      } else {
        btnText.style.display = 'block';
        loader.style.display = 'none';
        submitBtn.disabled = false;
      }
    }
  </script>

  <script>
    function togglePass(id, btn) {
      const field = document.getElementById(id);
      if (field.type === 'password') {
        field.type = 'text';
        btn.style.opacity = '1';
      } else {
        field.type = 'password';
        btn.style.opacity = '0.4';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Apple-style OLED Ambient Mesh Glows */
    .glow-1 {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 122, 255, 0.28) 0%, rgba(0, 0, 0, 0) 70%);
      top: 10%;
      left: 5%;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(175, 82, 222, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 10%;
      right: 5%;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
    }

    /* iOS Glassmorphic Container */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      background: rgba(26, 26, 28, 0.6);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 34px;
      padding: 36px 26px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.85),
                  inset 0 1px 1px rgba(255, 255, 255, 0.25);
      text-align: center;
      color: #ffffff;
    }

    .icon-box {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    h2 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .user-email {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 26px;
      word-break: break-all;
    }

    .input-group {
      position: relative;
      margin-bottom: 14px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      height: 52px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 0 46px 0 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 122, 255, 0.85);
      box-shadow: 0 0 0 3.5px rgba(0, 122, 255, 0.22);
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.45);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: #007AFF;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background: #006ee6;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 13.5px;
      line-height: 1.45;
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .error {
      background: rgba(255, 69, 58, 0.12);
      border: 1px solid rgba(255, 69, 58, 0.3);
      color: #ff6961;
    }

    .success {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.3);
      color: #32d74b;
    }

    /* iOS Spinner */
    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>

    <h2>Reset Password</h2>
    <p id="user-email" class="user-email">Verifying reset token...</p>

    <form id="reset-form">
      <div class="input-group">
        <input type="password" id="new-password" class="input-field" placeholder="New Password (min 6 chars)" required minlength="6">
        <button type="button" class="toggle-pass" onclick="togglePass('new-password', this)">👁️</button>
      </div>

      <div class="input-group">
        <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password" required minlength="6">
        <button type="button" class="toggle-pass" onclick="togglePass('confirm-password', this)">👁️</button>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        <span id="btn-text">Save Password</span>
        <div class="loader" id="loader"></div>
      </button>
    </form>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // আপনার অরিজিনাল Firebase কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAnS_6lAVSbf0oM5R1VgKiQjlH7MGbiqTE",
      authDomain: "sjemar-bdc9d.firebaseapp.com",
      databaseURL: "https://sjemar-bdc9d-default-rtdb.firebaseio.com",
      projectId: "sjemar-bdc9d",
      storageBucket: "sjemar-bdc9d.firebasestorage.app",
      messagingSenderId: "89516060006",
      appId: "1:89516060006:web:74ff45281b818dfc612ca7",
      measurementId: "G-6WQY9FYK0P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // URL থেকে ওটিপি/অ্যাকশন কোড নেওয়া
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    const emailEl = document.getElementById('user-email');
    const statusMsg = document.getElementById('status-msg');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');

    if (!oobCode) {
      showError("Invalid link: Missing action code/token.");
      form.style.display = 'none';
      emailEl.style.display = 'none';
    } else {
      // লিংকটির মেয়াদ ঠিক আছে কি না ভেরিফাই করা
      verifyPasswordResetCode(auth, oobCode)
        .then((email) => {
          emailEl.textContent = `for ${email}`;
        })
        .catch(() => {
          showError("This link is expired or has already been used.");
          form.style.display = 'none';
          emailEl.style.display = 'none';
        });
    }

    // পাসওয়ার্ড সাবমিট ইভেন্ট
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (pass !== confirmPass) {
        showError("Passwords do not match!");
        return;
      }

      setLoading(true);

      try {
        await confirmPasswordReset(auth, oobCode, pass);
        setLoading(false);
        form.style.display = 'none';
        emailEl.style.display = 'none';
        showSuccess("Password changed successfully! You can now log into your app.");
      } catch (err) {
        setLoading(false);
        showError(err.message || "Failed to update password.");
      }
    });

    function showError(msg) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
    }

    function showSuccess(msg) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg success';
      statusMsg.style.display = 'block';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnText.style.display = 'none';
        loader.style.display = 'block';
        submitBtn.disabled = true;
      } else {
        btnText.style.display = 'block';
        loader.style.display = 'none';
        submitBtn.disabled = false;
      }
    }
  </script>

  <script>
    function togglePass(id, btn) {
      const field = document.getElementById(id);
      if (field.type === 'password') {
        field.type = 'text';
        btn.style.opacity = '1';
      } else {
        field.type = 'password';
        btn.style.opacity = '0.45';
      }
    }
  </script>
</body>
</html>
